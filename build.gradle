
plugins {
    id 'com.android.application'
}

android {
    namespace 'in.gov.bhilwara.wildlife'
    compileSdk 35

    defaultConfig {
        applicationId 'in.gov.bhilwara.wildlife'
        minSdk 23
        targetSdk 35

        versionCode 3
        versionName '1.2'
    }
}

dependencies {
    // Media3 ExoPlayer for native video playback
    implementation 'androidx.media3:media3-exoplayer:1.5.1'

    // Media3 Player UI and playback controls
    implementation 'androidx.media3:media3-ui:1.5.1'

    // Media3 data source
    implementation 'androidx.media3:media3-datasource:1.5.1'
}
